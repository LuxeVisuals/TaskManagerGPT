<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscriptions — Freelance Tracker</title><link rel="stylesheet" href="styles.css"></head><body data-page="subscriptions"><header class="topbar"><a class="brand" href="index.html">Freelance Tracker</a><nav><a href="index.html">Home</a><a href="tasks.html">Tasks</a><a href="money.html">Money</a><a class="active" href="subscriptions.html">Subscriptions</a><a href="goals.html">Goals</a><a href="revenue.html">Revenue</a></nav></header><main class="container"><section class="page-heading"><div><span class="eyebrow">RECURRING COSTS</span><h1>Subscriptions</h1><p>All recurring expenses are in South African Rand.</p></div><button class="button primary" data-open-modal="subscription-modal">+ Add Subscription</button></section><section id="subscription-summary" class="summary-grid"></section><section class="toolbar"><h2 class="section-title">Your subscriptions</h2><label class="select-label">Sort <select id="subscription-sort"><option value="next-asc">Next payment: soonest</option><option value="cost-desc">Cost: highest</option><option value="cost-asc">Cost: lowest</option><option value="weekly">Weekly first</option><option value="monthly">Monthly first</option></select></label></section><div id="subscription-list" class="card-list"></div><div id="subscription-empty" class="empty-state hidden"><div class="empty-icon">S</div><h2>No subscriptions</h2><p>Add software, hosting, memberships and other recurring costs.</p><button class="button primary" data-open-modal="subscription-modal">Add a subscription</button></div></main><div class="modal-backdrop hidden" id="subscription-modal"><div class="modal"><button class="modal-close" data-close-modal>×</button><h2>Add Subscription</h2><p class="modal-subtitle">Recurring costs are tracked in ZAR.</p><form id="subscription-form"><label>Title<input name="title" required placeholder="e.g. Adobe"></label><label>Description<textarea name="description" rows="3"></textarea></label><div class="form-grid"><label>Cost (ZAR)<input name="cost" type="number" min="0" step="0.01" required></label><label>Frequency<select name="frequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option></select></label></div><label>Date purchased / first paid<input name="startDate" type="date" required></label><button class="button primary full" type="submit">Save Subscription</button></form></div></div><script src="app.js"></script></body></html>
