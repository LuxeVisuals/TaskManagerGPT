<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscriptions — Freelance Tracker</title><link rel="stylesheet" href="styles.css"></head><body data-page="subscriptions"><header><a class="brand" href="index.html">Freelance Tracker</a><nav><a href="index.html">Home</a><a href="tasks.html">Tasks</a><a class="active" href="subscriptions.html">Subscriptions</a><a href="goals.html">Goals</a></nav></header><main class="container"><section class="heading"><div><small>RECURRING COSTS</small><h1>Subscriptions</h1><p>All recurring expenses are in South African Rand.</p></div><button class="btn primary" data-open="sub-modal">+ Add Subscription</button></section><section id="sub-summary" class="summary"></section><section class="toolbar right"><label>Sort <select id="sub-sort"><option value="next">Next payment: soonest</option><option value="cost-desc">Cost: highest</option><option value="cost-asc">Cost: lowest</option><option value="weekly">Weekly first</option><option value="monthly">Monthly first</option></select></label></section><div id="sub-list" class="list"></div><div id="sub-empty" class="empty"><h2>No subscriptions</h2><p>Add software, hosting, memberships and other recurring costs.</p><button class="btn primary" data-open="sub-modal">Add a subscription</button></div></main><div class="modal hidden" id="sub-modal"><div class="modalbox"><button class="close" data-close>×</button><h2>Add Subscription</h2><form id="sub-form"><label>Title<input name="title" required placeholder="e.g. Adobe"></label><label>Description<textarea name="description" rows="3"></textarea></label><div class="two"><label>Cost (ZAR)<input name="cost" type="number" min="0" step="0.01" required></label><label>Frequency<select name="frequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option></select></label></div><label>Date purchased / first paid<input name="startDate" type="date" required></label><button class="btn primary full">Save Subscription</button></form></div></div><script src="app.js"></script></body></html>
