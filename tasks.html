<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks — Freelance Tracker</title><link rel="stylesheet" href="styles.css"></head><body data-page="tasks"><header><a class="brand" href="index.html">Freelance Tracker</a><nav><a href="index.html">Home</a><a class="active" href="tasks.html">Tasks</a><a href="subscriptions.html">Subscriptions</a><a href="goals.html">Goals</a></nav></header><main class="container"><section class="heading"><div><small>WORK MANAGEMENT</small><h1>Tasks</h1><p>Everything you are currently working on, with deadlines and money attached.</p></div><button class="btn primary" data-open="task-modal">+ Add Task</button></section><section class="toolbar"><div class="tabs" id="task-filter"><button class="active" data-filter="all">All</button><button data-filter="short">Short term</button><button data-filter="long">Long term</button></div><div class="tools"><label>Sort <select id="task-sort"><option value="deadline-asc">Deadline: soonest</option><option value="deadline-desc">Deadline: latest</option><option value="pay-desc">Pay: highest</option><option value="pay-asc">Pay: lowest</option><option value="revenue">Revenue first</option><option value="usd">USD first</option></select></label><button class="btn" id="export">Export Backup</button><label class="btn file">Import Backup<input id="import" type="file" accept="application/json"></label></div></section><div id="task-list" class="list"></div><div id="task-empty" class="empty"><h2>No tasks</h2><p>Add your first commission or project.</p><button class="btn primary" data-open="task-modal">Add a task</button></div></main><div class="modal hidden" id="task-modal"><div class="modalbox"><button class="close" data-close>×</button><h2>Add Task</h2><form id="task-form"><label>Title<input name="title" required placeholder="e.g. Client UI commission"></label><div class="two"><label>Type<select name="type"><option value="short">Short term</option><option value="long">Long term</option></select></label><label>Pay type<select name="payType"><option value="usd">USD ($)</option><option value="revenue">Revenue</option></select></label></div><label>Description<textarea name="description" rows="3"></textarea></label><label>Expected pay<input name="pay" required placeholder="50, 10%, or ?"></label><label>Deadline<input name="deadline" type="date" required></label><label>Checklist <span class="muted">one item per line</span><textarea name="checklist" rows="6" placeholder="Finish design&#10;Export assets&#10;Send to client"></textarea></label><button class="btn primary full">Save Task</button></form></div></div><script src="app.js"></script></body></html>
