<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks — Freelance Tracker</title><link rel="stylesheet" href="styles.css"></head><body data-page="tasks"><header class="topbar"><a class="brand" href="index.html">Freelance Tracker</a><nav><a href="index.html">Home</a><a class="active" href="tasks.html">Tasks</a><a href="money.html">Money</a><a href="subscriptions.html">Subscriptions</a><a href="goals.html">Goals</a><a href="revenue.html">Revenue</a></nav></header><main class="container"><section class="page-heading"><div><span class="eyebrow">WORK MANAGEMENT</span><h1>Tasks</h1><p>Everything you are currently working on, with deadlines and money attached.</p></div><button class="button primary" data-open-modal="task-modal">+ Add Task</button></section><section class="toolbar"><div class="tabs" id="task-filter"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="short">Short term</button><button class="tab" data-filter="long">Long term</button></div><div class="toolbar-right"><label class="select-label">Sort <select id="task-sort"><option value="deadline-asc">Deadline: soonest</option><option value="deadline-desc">Deadline: latest</option><option value="pay-desc">Pay: highest</option><option value="pay-asc">Pay: lowest</option><option value="revenue">Revenue first</option><option value="usd">USD first</option></select></label><button class="button secondary small" id="export-data">Export Backup</button><label class="button secondary small file-button">Import Backup<input id="import-data" type="file" accept="application/json"></label></div></section><div id="task-list" class="card-list"></div><div id="task-empty" class="empty-state hidden"><div class="empty-icon">T</div><h2>No tasks</h2><p>Add your first commission or project.</p><button class="button primary" data-open-modal="task-modal">Add a task</button></div></main><div class="modal-backdrop hidden" id="task-modal"><div class="modal"><button class="modal-close" data-close-modal>×</button><h2>Add Task</h2><p class="modal-subtitle">Add a commission or project with a deadline and expected pay.</p><form id="task-form"><label>Title<input name="title" required placeholder="e.g. Client UI commission"></label><div class="form-grid"><label>Type<select name="type"><option value="short">Short term</option><option value="long">Long term</option></select></label><label>Pay type<select name="payType"><option value="usd">USD ($)</option><option value="revenue">Revenue</option></select></label></div><label>Description<textarea name="description" rows="3"></textarea></label><label>Expected pay<input name="pay" required placeholder="50, 10%, or ?"></label><label>Deadline<input name="deadline" type="date" required></label><label>Checklist <span class="muted">one item per line</span><textarea name="checklist" rows="6" placeholder="Finish design&#10;Export assets&#10;Send to client"></textarea></label><button class="button primary full" type="submit">Save Task</button></form></div></div><script src="app.js"></script></body></html>
