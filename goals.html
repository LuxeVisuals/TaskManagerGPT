<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goals — Freelance Tracker</title><link rel="stylesheet" href="styles.css"></head><body data-page="goals"><header><a class="brand" href="index.html">Freelance Tracker</a><nav><a href="index.html">Home</a><a href="tasks.html">Tasks</a><a href="subscriptions.html">Subscriptions</a><a class="active" href="goals.html">Goals</a></nav></header><main class="container"><section class="heading"><div><small>TARGETS</small><h1>Goals</h1><p>Separate immediate targets from long-term objectives.</p></div><button class="btn primary" data-open="goal-modal">+ Add Goal</button></section><section class="toolbar"><div class="tabs" id="goal-filter"><button class="active" data-filter="all">All</button><button data-filter="short">Short term</button><button data-filter="long">Long term</button></div><label>Sort <select id="goal-sort"><option value="short">Short term first</option><option value="long">Long term first</option><option value="cost-desc">Cost: highest</option><option value="cost-asc">Cost: lowest</option><option value="usd">USD first</option></select></label></section><div id="goal-list" class="list"></div><div id="goal-empty" class="empty"><h2>No goals</h2><p>Add something worth working toward.</p><button class="btn primary" data-open="goal-modal">Add a goal</button></div></main><div class="modal hidden" id="goal-modal"><div class="modalbox"><button class="close" data-close>×</button><h2>Add Goal</h2><form id="goal-form"><label>Title<input name="title" required placeholder="e.g. Buy a new monitor"></label><label>Type<select name="type"><option value="short">Short term</option><option value="long">Long term</option></select></label><label>Description<textarea name="description" rows="4" required></textarea></label><div class="two"><label>Currency<select name="currency"><option value="ZAR">ZAR (R)</option><option value="USD">USD ($)</option></select></label><label>Cost<input name="cost" type="number" min="0" step="0.01" required></label></div><button class="btn primary full">Save Goal</button></form></div></div><script src="app.js"></script></body></html>
