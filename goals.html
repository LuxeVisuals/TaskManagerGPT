<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goals — Freelance Tracker</title><link rel="stylesheet" href="styles.css"></head><body data-page="goals"><header class="topbar"><a class="brand" href="index.html">Freelance Tracker</a><nav><a href="index.html">Home</a><a href="tasks.html">Tasks</a><a href="money.html">Money</a><a href="subscriptions.html">Subscriptions</a><a class="active" href="goals.html">Goals</a><a href="revenue.html">Revenue</a></nav></header><main class="container"><section class="page-heading"><div><span class="eyebrow">TARGETS</span><h1>Goals</h1><p>Separate immediate targets from long-term objectives.</p></div><button class="button primary" data-open-modal="goal-modal">+ Add Goal</button></section><section class="toolbar"><div class="tabs" id="goal-filter"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="short">Short term</button><button class="tab" data-filter="long">Long term</button></div><label class="select-label">Sort <select id="goal-sort"><option value="type-short">Short term first</option><option value="type-long">Long term first</option><option value="cost-desc">Cost: highest</option><option value="cost-asc">Cost: lowest</option><option value="currency">USD first</option></select></label></section><div id="goal-list" class="card-list"></div><div id="goal-empty" class="empty-state hidden"><div class="empty-icon">G</div><h2>No goals</h2><p>Add something worth working toward.</p><button class="button primary" data-open-modal="goal-modal">Add a goal</button></div></main><div class="modal-backdrop hidden" id="goal-modal"><div class="modal"><button class="modal-close" data-close-modal>×</button><h2>Add Goal</h2><p class="modal-subtitle">Set a target and what it costs to get there.</p><form id="goal-form"><label>Title<input name="title" required placeholder="e.g. Buy a new monitor"></label><label>Type<select name="type"><option value="short">Short term</option><option value="long">Long term</option></select></label><label>Description<textarea name="description" rows="4" required></textarea></label><div class="form-grid"><label>Currency<select name="currency"><option value="ZAR">ZAR (R)</option><option value="USD">USD ($)</option></select></label><label>Cost<input name="cost" type="number" min="0" step="0.01" required></label></div><button class="button primary full" type="submit">Save Goal</button></form></div></div><script src="app.js"></script></body></html>
